name: Summary model evaluation

# Manual-only A/B run of scripts/evaluate_summary_model.py for a Stage 3 model
# change. It runs the baseline and the candidate over the SAME committed frozen
# set with the SAME production prompts, in English and Japanese, and prints the
# automatic comparison into the Step Summary.
#
# It never changes published data, caches, or the production model, and it
# commits nothing: results are uploaded as a short-lived artifact for human
# review. Every run is capped by --max-cost-usd. The run logs carry only item
# ids, error types, and token/cost figures -- never source or output text.
on:
  workflow_dispatch:
    inputs:
      baseline:
        description: "Baseline model (current production)"
        required: true
        default: "claude-sonnet-5-5"
        type: choice
        options:
          - "claude-sonnet-5-5"
          - "claude-opus-4-8"
          - "claude-sonnet-5"
      candidate:
        description: "Candidate model"
        required: true
        default: "claude-opus-4-8"
        type: choice
        options:
          - "claude-opus-4-8"
          - "claude-sonnet-5-5"
          - "claude-sonnet-5"
          - "claude-opus-5-5"
          - "claude-haiku-5-5"
          - "gpt-6.1-sol"
      openai_reasoning_effort:
        description: "Reasoning effort for an OpenAI candidate (ignored for Claude; gpt-6.1-sol cannot turn reasoning off)"
        required: true
        default: "low"
        type: choice
        options:
          - "low"
          - "medium"
      baseline_run_id:
        description: "Optional: reuse the baseline results from this earlier run's artifact instead of calling the baseline model again (no baseline spend). Only valid while the frozen set and prompts are unchanged."
        required: false
        default: ""
        type: string
      profile:
        description: "Frozen set: hard (adversarial) or stratified (broad)"
        required: true
        default: "hard"
        type: choice
        options:
          - "hard"
          - "stratified"
      max_cost_usd_per_run:
        description: "Cap for EACH of the four runs (2 models x 2 languages)"
        required: true
        default: "1.00"
        type: choice
        options:
          - "0.50"
          - "1.00"

permissions:
  contents: read
  # Only to download an earlier run's artifact when baseline_run_id is set.
  actions: read

concurrency:
  group: summary-model-eval
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Inputs travel through env, never interpolated into the script text.
      BASELINE: ${{ inputs.baseline }}
      CANDIDATE: ${{ inputs.candidate }}
      PROFILE: ${{ inputs.profile }}
      MAX_COST: ${{ inputs.max_cost_usd_per_run }}
      OPENAI_REASONING_EFFORT: ${{ inputs.openai_reasoning_effort }}
      BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile and run offline tests
        run: |
          python -m py_compile scripts/summarize_updates.py scripts/evaluate_summary_model.py scripts/anthropic_batch.py scripts/openai_provider.py
          python -m unittest discover -s tests

      - name: Reuse baseline results from an earlier run
        if: ${{ inputs.baseline_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
        run: |
          set -euo pipefail
          case "$BASELINE_RUN_ID" in (*[!0-9]*|'') echo "::error::baseline_run_id must be a numeric run id"; exit 1;; esac
          gh run download "$BASELINE_RUN_ID" --repo "$GITHUB_REPOSITORY" -n summary-model-eval -D "$RUNNER_TEMP/baseline"
          suffix=""; [ "$PROFILE" = "stratified" ] || suffix="_$PROFILE"
          mkdir -p data/eval
          for name in "results_english${suffix}_${BASELINE}.json" "results_japanese${suffix}_${BASELINE}.json"; do
            src="$RUNNER_TEMP/baseline/$name"
            if [ ! -f "$src" ]; then
              echo "::error::run $BASELINE_RUN_ID has no $name (wrong profile or baseline model?)"; exit 1
            fi
            cp "$src" "data/eval/$name"
            echo "reused $name from run $BASELINE_RUN_ID"
          done

      - name: Run both models over the frozen set
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Only read when a gpt-* model is selected; unset otherwise.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ "$BASELINE" = "$CANDIDATE" ]; then
            echo "::error::baseline and candidate must differ"; exit 1
          fi
          for language in english japanese; do
            for model in "$BASELINE" "$CANDIDATE"; do
              if [ "$model" = "$BASELINE" ] && [ -n "$BASELINE_RUN_ID" ]; then
                echo "baseline $model / $language reused from run $BASELINE_RUN_ID; not called"; continue
              fi
              echo "::group::$model / $language / $PROFILE"
              python scripts/evaluate_summary_model.py run \
                --model "$model" --language "$language" --profile "$PROFILE" \
                --limit 30 --max-cost-usd "$MAX_COST" --confirm-spend
              echo "::endgroup::"
            done
          done

      - name: Compare
        run: |
          set -euo pipefail
          {
            echo "## Summary model evaluation: $BASELINE vs $CANDIDATE ($PROFILE)"
            for language in english japanese; do
              echo ""
              echo "### $language"
              echo '```'
              python scripts/evaluate_summary_model.py compare \
                --baseline "$BASELINE" --candidate "$CANDIDATE" \
                --language "$language" --profile "$PROFILE"
              echo '```'
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload results for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summary-model-eval
          path: |
            data/eval/results_*.json
            data/eval/side_by_side_*.md
          retention-days: 14
          if-no-files-found: warn
