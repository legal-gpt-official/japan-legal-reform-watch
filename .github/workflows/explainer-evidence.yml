name: Explainer evidence packs

# Builds data/explainer_evidence/<seed>.json for the queued new candidates and for every
# unfinished or held dossier: e-Gov Law API v2 revision lists, old/new article text,
# the amending instrument's supplementary provisions, commencement stages, and whether a
# public-comment draft has been promulgated. Runs on a GitHub-hosted runner because the
# writing environments cannot fetch official sites (the held dossiers of 2026-11-14/15
# had fetched nothing). No AI, no paid API, official hosts only, bounded calls; it never
# edits explainers, case files or the published site, and never relaxes a gate.
on:
  workflow_run:
    workflows: ["Daily update legal reform data"]
    types: [completed]
  schedule:
    # 10:20 JST, ahead of the 11:00 writing slot; a second pass at 20:20 JST.
    - cron: "20 1,11 * * *"
  workflow_dispatch:
    inputs:
      seeds:
        description: "Optional comma-separated raw ids to (re)build in addition to the queue"
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: explainer-evidence
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out latest main
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # Restore only trusted main-branch cache data. Never write response bodies to git.
      - name: Restore bounded historical law cache
        if: github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/jlrw-historical-law
          key: jlrw-historical-law-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            jlrw-historical-law-v1-

      - name: Build evidence packs from official e-Gov data
        env:
          SEEDS: ${{ github.event.inputs.seeds || '' }}
        run: |
          set -o pipefail
          cache_args=()
          if [ -z "$SEEDS" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            cache_args=(--historical-cache "$RUNNER_TEMP/jlrw-historical-law")
          fi
          python scripts/explainer_evidence.py build --from-queue 25 --include-ledger --with-documents \
            --prune --max-api-calls 220 --seeds "$SEEDS" "${cache_args[@]}" | tee evidence.log
          {
            echo '### Explainer evidence packs'
            echo '```'
            tail -n 40 evidence.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit packs when they changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data/explainer_evidence
          if git diff --cached --quiet; then
            echo "Evidence unchanged."
            exit 0
          fi
          git commit -m "Update explainer evidence packs"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then echo "committed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            if [ "$attempt" = 3 ]; then echo "::error::evidence push failed after 3 attempts"; exit 1; fi
            git pull --rebase origin main || { git rebase --abort; echo "::error::rebase conflict; the next run rebuilds"; exit 1; }
          done

      # The ledger plans the next slot from the packs (ready candidates first, holds released
      # by new evidence), so refresh it when they changed.
      - name: Refresh the pipeline ledger
        if: steps.commit.outputs.committed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'explainer-pipeline.yml', ref: 'main'
            });
