name: English summary backfill

# Manual-only, resumable full-corpus English summarization. Each checkpoint
# refreshes any invalidated zh-Hans translations before committing, so the
# public site never publishes Chinese text derived from stale English fields.
on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Maximum new English summaries in this checkpoint"
        required: true
        default: "10"
        type: choice
        options:
          - "10"
          - "100"
          - "250"
          - "500"
      parallelism:
        description: "Concurrent direct English calls (use 1 for a cost canary)"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "4"
          - "8"
      summary_max_cost_usd:
        description: "Measured English estimated-cost cap for this checkpoint"
        required: true
        default: "0.50"
        type: choice
        options:
          - "0.50"
          - "2.00"
          - "5.00"
          - "10.00"
      translation_max_cost_usd:
        description: "Measured zh-Hans refresh estimated-cost cap"
        required: true
        default: "0.50"
        type: choice
        options:
          - "0.50"
          - "2.00"
          - "5.00"

permissions:
  contents: write
  pages: write

concurrency:
  group: japan-legal-reform-data-writer
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out main
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile backfill scripts
        run: >-
          python -m py_compile
          scripts/summarize_updates.py
          scripts/translate_updates.py
          scripts/build_public_archives.py
          scripts/anthropic_batch.py

      - name: Run offline regression tests
        run: python -m unittest discover -s tests

      - name: Backfill English and refresh zh-Hans checkpoint
        id: checkpoint
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_SUMMARY_MODEL: claude-opus-4-8
          ANTHROPIC_TRANSLATION_MODEL: claude-sonnet-5
          BATCH_SIZE: ${{ inputs.batch_size }}
          PARALLELISM: ${{ inputs.parallelism }}
          SUMMARY_MAX_COST_USD: ${{ inputs.summary_max_cost_usd }}
          TRANSLATION_MAX_COST_USD: ${{ inputs.translation_max_cost_usd }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          count_english() {
            python - <<'PY'
          import json
          with open("docs/data/legal_updates.json", encoding="utf-8") as fh:
              items = json.load(fh)
          fields = ("title_en", "summary_en", "business_impact_en", "recommended_action_en")
          print(sum(
              item.get("summary_source") == "claude"
              and item.get("confidence") in ("high", "medium", "low")
              and bool(str(item.get("summarized_at", "")).strip())
              and bool(str(item.get("summary_model", "")).strip())
              and all(isinstance(item.get(field), str) and item[field].strip() for field in fields)
              for item in items
          ))
          PY
          }

          count_chinese() {
            python - <<'PY'
          import json
          with open("docs/data/legal_updates.json", encoding="utf-8") as fh:
              items = json.load(fh)
          fields = ("title", "summary", "business_impact", "recommended_action")
          print(sum(
              isinstance(item.get("translations"), dict)
              and isinstance(item["translations"].get("zh-Hans"), dict)
              and all(
                  isinstance(item["translations"]["zh-Hans"].get(field), str)
                  and item["translations"]["zh-Hans"][field].strip()
                  for field in fields
              )
              for item in items
          ))
          PY
          }

          japanese_signature() {
            python - <<'PY'
          import hashlib
          import json
          with open("docs/data/legal_updates.json", encoding="utf-8") as fh:
              items = json.load(fh)
          fields = (
              "summary_ja", "business_impact_ja", "recommended_action_ja",
              "summary_ja_source", "ja_summarized_at", "ja_summary_model",
          )
          payload = [
              [item.get("id"), *[item.get(field) for field in fields]]
              for item in items
          ]
          encoded = json.dumps(payload, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
          print(hashlib.sha256(encoded).hexdigest())
          PY
          }

          total=$(python -c 'import json; print(len(json.load(open("docs/data/legal_updates.json", encoding="utf-8"))))')
          before=$(count_english)
          before_zh=$(count_chinese)
          before_ja=$(japanese_signature)
          echo "Starting English coverage: ${before}/${total}; zh-Hans: ${before_zh}/${total}" | tee -a "$GITHUB_STEP_SUMMARY"

          if [ "$before" -eq "$total" ]; then
            echo "English summary backfill already complete: ${before}/${total}." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "before=${before}" >> "$GITHUB_OUTPUT"
            echo "after=${before}" >> "$GITHUB_OUTPUT"
            echo "total=${total}" >> "$GITHUB_OUTPUT"
            echo "complete=true" >> "$GITHUB_OUTPUT"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python scripts/summarize_updates.py \
            --all-items \
            --english-only \
            --api-limit "$BATCH_SIZE" \
            --parallel "$PARALLELISM" \
            --max-cost-usd "$SUMMARY_MAX_COST_USD" 2>&1 | tee summarize_run.log

          # English changes invalidate their derived Chinese cache hashes. Refresh
          # them in the same checkpoint so stale translations are never published.
          python scripts/translate_updates.py \
            --locale zh-Hans \
            --limit "$total" \
            --max-cost-usd "$TRANSLATION_MAX_COST_USD" \
            --retry-kana-title-without-ja-reference \
            --provider-failure-mode fail 2>&1 | tee translate_run.log

          python scripts/build_public_archives.py

          after=$(count_english)
          after_zh=$(count_chinese)
          after_ja=$(japanese_signature)
          echo "English coverage: ${before} -> ${after} of ${total}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "zh-Hans coverage: ${before_zh} -> ${after_zh} of ${total}" | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo "### English summary usage"
            grep -E '^(api_calls|summarized_items|failed_items|english_remaining|provider_status|provider_error_type|provider_aborted_items|cost_budget_skipped|input_tokens|output_tokens|estimated_cost_usd|max_cost_usd)' summarize_run.log || true
            echo "### zh-Hans refresh usage"
            grep -E '^(api_calls|title_reference_retries|title_reference_retry_successes|translated_items|failed_items|quality_rejected_items|provider_status|provider_error_type|provider_aborted_items|cost_budget_skipped|input_tokens|output_tokens|cache_creation_input_tokens|cache_read_input_tokens|estimated_cost_usd|max_cost_usd)' translate_run.log || true
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$after" -lt "$before" ]; then
            echo "English coverage shrank; refusing to checkpoint."
            exit 1
          fi
          if [ "$after" -eq "$before" ]; then
            echo "No English-summary progress; stopping for diagnosis."
            exit 1
          fi
          if [ "$after_ja" != "$before_ja" ]; then
            echo "Japanese summary fields changed during English-only backfill; refusing to checkpoint."
            exit 1
          fi
          if [ "$after_zh" -lt "$before_zh" ]; then
            echo "zh-Hans coverage shrank during refresh; refusing to publish stale/fallback churn."
            exit 1
          fi

          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "origin/main advanced during the checkpoint; refusing a non-fast-forward push."
            exit 1
          fi

          git add \
            data/summary_cache.json \
            data/translation_cache.json \
            docs/data/legal_updates.json \
            docs/data/legal_updates_manifest.json \
            docs/data/archive
          git commit -m "Backfill English summaries (${after}/${total})"
          git push origin "HEAD:main"

          echo "before=${before}" >> "$GITHUB_OUTPUT"
          echo "after=${after}" >> "$GITHUB_OUTPUT"
          echo "total=${total}" >> "$GITHUB_OUTPUT"
          echo "committed=true" >> "$GITHUB_OUTPUT"
          if [ "$after" -eq "$total" ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Request Pages build for checkpoint
        if: steps.checkpoint.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/pages/builds"

      - name: Final semantic integrity gate
        if: steps.checkpoint.outputs.complete == 'true'
        run: |
          python - <<'PY'
          import json
          import sys

          sys.path.insert(0, "scripts")
          import summarize_updates as summarizer
          import translate_updates as translator

          with open("docs/data/legal_updates.json", encoding="utf-8") as fh:
              items = json.load(fh)
          with open("data/raw_items.json", encoding="utf-8") as fh:
              raw_items = json.load(fh)
          with open("data/summary_cache.json", encoding="utf-8") as fh:
              summary_cache = json.load(fh)
          with open("data/translation_cache.json", encoding="utf-8") as fh:
              translation_cache = json.load(fh).get("entries", {}).get("zh-Hans", {})

          raw_by_id = {item.get("id"): item for item in raw_items}
          failures = []
          for item in items:
              item_id = item.get("id", "")
              if item.get("summary_source") != "claude" or not summarizer.valid_result(item):
                  failures.append(f"{item_id}: incomplete English AI summary")
              summary_key = summarizer.cache_key(item, raw_by_id)
              if not summarizer.valid_result(summary_cache.get(summary_key)):
                  failures.append(f"{item_id}: missing current English summary cache")
              block = item.get("translations", {}).get("zh-Hans")
              entry = translation_cache.get(item_id)
              expected_hash = translator.compute_source_hash(
                  item, "zh-Hans", translator.PROMPT_VERSION
              )
              if not translator.valid_translation(block):
                  failures.append(f"{item_id}: incomplete zh-Hans translation")
              if not isinstance(entry, dict) or entry.get("source_hash") != expected_hash:
                  failures.append(f"{item_id}: stale/missing zh-Hans cache")
          if failures:
              print("English backfill integrity failures:")
              for failure in failures[:30]:
                  print(f"- {failure}")
              raise SystemExit(1)
          print(f"Verified complete English summaries and current zh-Hans translations for {len(items)} items.")
          PY

      - name: Mark partial checkpoint incomplete
        if: steps.checkpoint.outputs.complete == 'false'
        run: |
          echo "Checkpoint committed: ${{ steps.checkpoint.outputs.after }}/${{ steps.checkpoint.outputs.total }} English summaries. Rerun after reviewing measured cost." | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
