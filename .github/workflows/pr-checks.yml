name: Pull request checks

# Read-only checks for every pull request: compile the pipeline scripts, run
# the full offline regression suite (the same gate the daily workflow runs
# before it fetches anything), and validate every reform explainer against
# the official records in the repository. No secrets, no API calls, no writes:
# the job has read-only repository access and its log is public.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile pipeline scripts
        run: python -m py_compile scripts/*.py

      - name: Run offline regression tests
        run: python -m unittest discover -s tests

      - name: Validate all published explainer translations
        run: python scripts/explainer_locales.py validate

      - name: Validate reform explainers
        env:
          EXPLAINER_PUBLISH_POLICY: ${{ vars.EXPLAINER_PUBLISH_POLICY }}
        run: |
          set -o pipefail
          python scripts/explainers.py validate | tee explainer_validate.log
          { echo "### Reform explainers"; echo '```'; cat explainer_validate.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
