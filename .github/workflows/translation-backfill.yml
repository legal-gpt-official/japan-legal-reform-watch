name: Translation backfill (zh-Hans)

# Manual-only, translate-ONLY backfill. It never fetches, builds, summarizes, or
# touches source-health — it only runs scripts/translate_updates.py and commits
# the two translation artifacts. This lets the zh-Hans corpus accumulate without
# the daily pipeline regenerating the published file underneath it.

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

# Serialize against the daily pipeline so the two never write data concurrently.
concurrency:
  group: japan-legal-reform-data-writer
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # Only the translator is executed by this workflow, so only it is compiled here.
      - name: Compile translator
        run: python -m py_compile scripts/translate_updates.py scripts/anthropic_batch.py

      - name: Run offline regression tests
        run: python -m unittest discover -s tests

      - name: Count translations before
        id: before
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          pub = json.load(open("docs/data/legal_updates.json", encoding="utf-8"))
          cache = json.load(open("data/translation_cache.json", encoding="utf-8"))
          n_pub = sum(1 for it in pub if isinstance(it.get("translations"), dict) and "zh-Hans" in it["translations"])
          n_cache = len(cache.get("entries", {}).get("zh-Hans", {}))
          print(f"published={n_pub}")
          print(f"cache={n_cache}")
          PY

      - name: Translate Simplified Chinese updates
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Translation-only model override: zh-Hans translation uses Sonnet 5;
          # summarization stays on Opus 4.8. Precedence for translation is
          # --model > ANTHROPIC_TRANSLATION_MODEL > DEFAULT_TRANSLATION_MODEL.
          ANTHROPIC_TRANSLATION_MODEL: claude-sonnet-5
        # fail mode: a fatal provider error (e.g. insufficient credit) while
        # untranslated candidates remain exits 1, failing the backfill before any
        # commit so a credit/auth problem is loud and no partial state is pushed.
        run: python scripts/translate_updates.py --locale zh-Hans --limit 30 --batch --provider-failure-mode fail

      - name: Count translations after
        id: after
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          pub = json.load(open("docs/data/legal_updates.json", encoding="utf-8"))
          cache = json.load(open("data/translation_cache.json", encoding="utf-8"))
          n_pub = sum(1 for it in pub if isinstance(it.get("translations"), dict) and "zh-Hans" in it["translations"])
          n_cache = len(cache.get("entries", {}).get("zh-Hans", {}))
          print(f"published={n_pub}")
          print(f"cache={n_cache}")
          PY

      - name: Semantic integrity gate
        env:
          BEFORE_PUBLISHED: ${{ steps.before.outputs.published }}
          BEFORE_CACHE: ${{ steps.before.outputs.cache }}
          AFTER_PUBLISHED: ${{ steps.after.outputs.published }}
          AFTER_CACHE: ${{ steps.after.outputs.cache }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          sys.path.insert(0, "scripts")
          import translate_updates as translator

          before_pub = int(os.environ["BEFORE_PUBLISHED"])
          before_cache = int(os.environ["BEFORE_CACHE"])
          after_pub = int(os.environ["AFTER_PUBLISHED"])
          after_cache = int(os.environ["AFTER_CACHE"])
          print(f"before: published={before_pub} cache={before_cache}")
          print(f"after:  published={after_pub} cache={after_cache}")

          if after_cache < before_cache:
              raise SystemExit(
                  f"Translation cache shrank ({before_cache} -> {after_cache}); failing."
              )
          if after_pub < before_pub:
              raise SystemExit(
                  f"Published translations shrank ({before_pub} -> {after_pub}); failing."
              )

          with open("docs/data/legal_updates.json", encoding="utf-8") as fh:
              published = json.load(fh)
          with open("data/translation_cache.json", encoding="utf-8") as fh:
              cache = json.load(fh).get("entries", {}).get("zh-Hans", {})

          failures = []
          checked = 0
          for item in published:
              translations = item.get("translations")
              if not isinstance(translations, dict) or "zh-Hans" not in translations:
                  continue
              checked += 1
              item_id = item.get("id")
              block = translations["zh-Hans"]
              entry = cache.get(item_id)
              expected_hash = translator.compute_source_hash(
                  item, "zh-Hans", translator.PROMPT_VERSION
              )
              if not isinstance(entry, dict):
                  failures.append(f"{item_id}: missing cache entry")
                  continue
              if entry.get("source_hash") != expected_hash:
                  failures.append(f"{item_id}: stale cache hash")
                  continue
              if entry.get("prompt_version") != translator.PROMPT_VERSION:
                  failures.append(f"{item_id}: stale prompt version")
                  continue
              if not translator.valid_translation(entry) or not translator.valid_title(
                  entry.get("title")
              ):
                  failures.append(f"{item_id}: invalid cached translation")
                  continue
              if not isinstance(block, dict) or any(
                  block.get(field) != entry.get(field)
                  for field in translator.TRANSLATION_FIELDS
              ):
                  failures.append(f"{item_id}: published/cache content mismatch")

          if checked != after_pub:
              failures.append(
                  f"count step reported {after_pub} published translations; verified {checked}"
              )
          if len(cache) != after_cache:
              failures.append(
                  f"count step reported {after_cache} cache entries; verified {len(cache)}"
              )
          if failures:
              print("Semantic integrity failures:")
              for failure in failures[:20]:
                  print(f"- {failure}")
              if len(failures) > 20:
                  print(f"- ... and {len(failures) - 20} more")
              raise SystemExit(1)

          stale_cache_only = len(cache) - checked
          print(
              f"Verified {checked} published translations; "
              f"cache-only stale/history entries allowed={stale_cache_only}."
          )
          PY

      - name: Pre-push sync check
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "origin/main advanced since checkout; aborting to avoid a non-fast-forward push."
            echo "Re-run the workflow on the updated main (no rebase or force-push is attempted)."
            exit 1
          fi

      - name: Commit and push translations only
        id: translation_commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/translation_cache.json docs/data/legal_updates.json
          if git diff --cached --quiet; then
            echo "No translation changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Backfill zh-Hans translations"
          git push origin HEAD:main
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Request Pages build for committed translations
        if: steps.translation_commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/pages/builds"
