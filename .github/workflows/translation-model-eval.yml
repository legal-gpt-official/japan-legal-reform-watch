name: Translation model evaluation

# Manual-only A/B run of scripts/evaluate_translation_model.py for a Stage 4
# (zh-Hans) model change. It runs the baseline and the candidate over the SAME
# committed frozen set with the SAME production prompt, validation,
# normalization, title gate and title retry, and prints the automatic comparison
# into the Step Summary.
#
# It never changes published data, caches, or the production model, and it
# commits nothing: results are uploaded as a short-lived artifact for human
# review. Every run is capped by --max-cost-usd. The run logs carry only item
# ids, error types, and cost figures -- never source or output text.
on:
  workflow_dispatch:
    inputs:
      baseline:
        description: "Baseline model (current production translation model)"
        required: true
        default: "claude-sonnet-5"
        type: choice
        options:
          - "claude-sonnet-5"
          - "claude-sonnet-5-5"
          - "claude-haiku-4-5"
      candidate:
        description: "Candidate model"
        required: true
        default: "claude-haiku-5-5"
        type: choice
        options:
          - "claude-haiku-5-5"
          - "claude-sonnet-5-5"
          - "claude-haiku-4-5"
          - "claude-sonnet-5"
      profile:
        description: "Frozen set: hard (title-gate and naming traps) or stratified (broad)"
        required: true
        default: "hard"
        type: choice
        options:
          - "hard"
          - "stratified"
      max_cost_usd_per_run:
        description: "Cap for EACH of the two runs"
        required: true
        default: "1.00"
        type: choice
        options:
          - "0.50"
          - "1.00"

permissions:
  contents: read

concurrency:
  group: translation-model-eval
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Inputs travel through env, never interpolated into the script text.
      BASELINE: ${{ inputs.baseline }}
      CANDIDATE: ${{ inputs.candidate }}
      PROFILE: ${{ inputs.profile }}
      MAX_COST: ${{ inputs.max_cost_usd_per_run }}

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile and run offline tests
        run: |
          python -m py_compile scripts/translate_updates.py scripts/evaluate_translation_model.py scripts/anthropic_batch.py
          python -m unittest discover -s tests

      - name: Run both models over the frozen set
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [ "$BASELINE" = "$CANDIDATE" ]; then
            echo "::error::baseline and candidate must differ"; exit 1
          fi
          for model in "$BASELINE" "$CANDIDATE"; do
            echo "::group::$model / $PROFILE"
            python scripts/evaluate_translation_model.py run \
              --model "$model" --profile "$PROFILE" \
              --limit 30 --max-cost-usd "$MAX_COST" --confirm-spend
            echo "::endgroup::"
          done

      - name: Compare
        run: |
          set -euo pipefail
          {
            echo "## Translation model evaluation: $BASELINE vs $CANDIDATE ($PROFILE)"
            echo '```'
            python scripts/evaluate_translation_model.py compare \
              --baseline "$BASELINE" --candidate "$CANDIDATE" --profile "$PROFILE"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload results for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: translation-model-eval
          path: |
            data/eval/results_translation*.json
            data/eval/side_by_side_translation*.md
          retention-days: 14
          if-no-files-found: warn
