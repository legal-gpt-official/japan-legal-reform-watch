name: Publish reform explainer pages

# Rebuild static pages promptly after a validated explainer PR is merged.
# No AI API calls, Stripe/Resend secrets, raw-data fetches or translations.
# GITHUB_TOKEN pushes do not recursively launch this workflow.
on:
  push:
    branches: [main]
    paths:
      - "data/explainers/**"
      - "data/explainer_locales/**"
      - "scripts/explainers.py"
      - "scripts/build_public_pages.py"
      - "docs/style.css"
      - ".github/workflows/publish-explainer-pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

# Coordinate with daily data publishing; never race updates to docs/u or index.
concurrency:
  group: japan-legal-reform-data-writer
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run offline regression tests
        run: python -m unittest discover -s tests

      - name: Validate reform explainers
        env:
          EXPLAINER_PUBLISH_POLICY: ${{ vars.EXPLAINER_PUBLISH_POLICY }}
        run: python scripts/explainers.py validate

      - name: Build public pages
        env:
          EXPLAINER_PUBLISH_POLICY: ${{ vars.EXPLAINER_PUBLISH_POLICY }}
        run: python scripts/build_public_pages.py

      - name: Commit regenerated static pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/sitemap.xml docs/areas docs/public-comments docs/u
          if git diff --cached --quiet; then
            echo "Generated static pages already match the published corpus."
          else
            git commit -m "Publish AI-checked reform explainers"
            git push
          fi

      - name: Request GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/pages/builds"
