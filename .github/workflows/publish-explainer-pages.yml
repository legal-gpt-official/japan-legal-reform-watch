name: Publish reform explainer pages

# Rebuild static pages promptly after a validated explainer PR is merged.
# No AI API calls, Stripe/Resend secrets, raw-data fetches or translations.
# GITHUB_TOKEN pushes do not recursively launch this workflow.
on:
  push:
    branches: [main]
    paths:
      - "data/explainers/**"
      - "data/explainer_locales/**"
      - "scripts/explainers.py"
      - "scripts/explainer_locales.py"
      - "scripts/explainer_facts.py"
      - "scripts/law_timeline.py"
      - "scripts/build_public_pages.py"
      - "scripts/weekly_roundups.py"
      - "docs/style.css"
      - ".github/workflows/publish-explainer-pages.yml"
  workflow_dispatch:
  # Nightly catch-up: recover a missed push-triggered publication and request
  # fresh Pages deployment even when no new explainer PR was merged today.
  # GitHub cron is UTC; 11:40 UTC = 20:40 JST (no daylight saving).
  schedule:
    - cron: "40 11 * * *"

permissions:
  contents: write
  pages: write

# Coordinate with daily data publishing; never race updates to docs/u or index.
concurrency:
  group: japan-legal-reform-data-writer
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # The latest main, not the triggering commit: this run may have waited
          # behind the daily data run in the concurrency group, and building from
          # the older commit would make the push fail or regress its pages.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run offline regression tests
        # Live repository-state explainer checks (official records drifting away
        # from an explainer) are reported by the explainer validation step and
        # withhold only that explainer; they must not stop this whole run.
        env:
          JLRW_LIVE_EXPLAINER_STATE: report
        run: python -m unittest discover -s tests

      # Report-only here: the page build itself withholds every invalid explainer
      # and every invalid or stale translation, so one defective explainer must
      # not stop the pages of all the others from being rebuilt. Pull requests
      # are gated by pr-checks.yml, where both validations are blocking.
      - name: Validate reform explainers
        env:
          EXPLAINER_PUBLISH_POLICY: ${{ vars.EXPLAINER_PUBLISH_POLICY }}
        run: python scripts/explainers.py validate || echo "::warning::An explainer failed validation and is withheld."

      - name: Validate translations
        run: python scripts/explainer_locales.py validate || echo "::warning::A translation failed validation and is withheld; English is published."

      - name: Build public pages
        env:
          EXPLAINER_PUBLISH_POLICY: ${{ vars.EXPLAINER_PUBLISH_POLICY }}
        run: python scripts/build_public_pages.py

      - name: Verify recent explainers have generated EN, JA and ZH pages
        run: |
          python - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo

          cutoff = (datetime.now(ZoneInfo("Asia/Tokyo")).date() - timedelta(days=2)).isoformat()
          checked = 0
          failures = []
          for english_file in sorted(Path("data/explainers").glob("*.json")):
              en = json.loads(english_file.read_text(encoding="utf-8"))
              if en.get("status") != "published" or en.get("verified_at", "") < cutoff:
                  continue
              checked += 1
              dossier = en["dossier_id"]
              item_ids = en.get("related_item_ids") or []
              if not item_ids:
                  failures.append(f"{dossier}: no source items")
                  continue
              bundle_path = Path("data/explainer_locales") / (dossier + ".json")
              if not bundle_path.exists():
                  failures.append(f"{dossier}: no JA/ZH locale file")
                  continue
              locale = json.loads(bundle_path.read_text(encoding="utf-8"))["translations"]
              body = english_file.read_bytes()
              blob_sha = hashlib.sha1(f"blob {len(body)}\0".encode() + body).hexdigest()
              for lang in ("ja", "zh-Hans"):
                  tr = locale.get(lang) or {}
                  if (tr.get("english_verified_at") != en.get("verified_at")
                          or tr.get("english_source_fingerprint") != en.get("source_fingerprint")
                          or tr.get("english_file_sha") != blob_sha):
                      failures.append(f"{dossier}: {lang} not synced to English")
              for item in item_ids:
                  for segment in ("", "ja", "zh"):
                      page = Path("docs/u") / item / segment / "index.html"
                      if not page.is_file():
                          failures.append(f"{dossier}: missing {page}")
                          continue
                      if "explainer-title" not in page.read_text(encoding="utf-8"):
                          failures.append(f"{dossier}: explainer missing in {page}")
          print(f"Recent published dossiers checked: {checked} (since {cutoff}, JST)")
          if failures:
              for failure in failures:
                  print(f"::error::{failure}")
              raise SystemExit(1)
          PY

      - name: Commit regenerated static pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/sitemap.xml docs/areas docs/public-comments docs/weekly docs/feeds/weekly.xml docs/u
          if git diff --cached --quiet; then
            echo "Generated static pages already match the published corpus."
          else
            git commit -m "Publish AI-checked reform explainers"
            # main may have moved while this job ran (an explainer PR merged by the
            # scheduled writer, say). Rebase this commit onto it instead of losing
            # the run; a real conflict aborts the rebase and fails loudly.
            for attempt in 1 2 3; do
              if git push origin HEAD:"$(git branch --show-current)"; then break; fi
              if [ "$attempt" = 3 ]; then echo "::error::push failed after 3 attempts"; exit 1; fi
              git pull --rebase origin "$(git branch --show-current)" || { git rebase --abort; echo "::error::main changed generated files concurrently; rerun this workflow"; exit 1; }
            done
          fi

      - name: Request GitHub Pages build
        id: pages_request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/pages/builds"


      # Record the exact docs/main commit used for this recovery build. A
      # queued Pages build is not proof of deploy or live content freshness.
      - name: Record generated docs commit and Pages handoff
        if: always()
        run: |
          {
            echo '### Publish handoff provenance'
            echo "Publisher checkout HEAD: $(git rev-parse HEAD)"
            echo "Current origin/main: $(git ls-remote origin refs/heads/main | cut -f1)"
            echo "Pages request step: ${{ steps.pages_request.conclusion }}"
            echo "Do not count as PAGES_DEPLOYED until the GitHub Pages run succeeds against generated docs SHA."
            echo "Do not count as LIVE_VERIFIED until 3-language HTTP/body comparison succeeds."
          } >> "$GITHUB_STEP_SUMMARY"
