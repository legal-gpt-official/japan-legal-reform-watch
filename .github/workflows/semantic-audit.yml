name: Semantic audit

# Weekly + manual, READ-ONLY sampled semantic review (scripts/semantic_audit.py): a
# reviewer model reads a deterministic, risk-weighted sample of published items
# against their Japanese source and reports meaning-level errors with quoted
# evidence (obligations, regulated parties, draft vs enacted, transitional
# measures, identifiers, dates, Chinese/Japanese meaning shifts). Findings are
# suggestions for a person to confirm; this workflow commits nothing and uploads
# an artifact, so an AI verdict alone can never change published data. Each run
# also reviews a few planted-defect copies (canaries) and warns when the
# reviewer misses one. Weekly (Monday 10:00 JST, owner-approved 2026-10-16),
# clear of the 06:00 JST daily data run.
on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:
    inputs:
      size:
        description: "Items to sample"
        required: true
        default: "20"
        type: choice
        options: ["10", "20", "40"]
      canaries:
        description: "Planted-defect copies reviewed for sensitivity"
        required: true
        default: "5"
        type: choice
        options: ["0", "5", "10"]
      reasoning_effort:
        description: "Reviewer reasoning effort"
        required: true
        default: "medium"
        type: choice
        options: ["low", "medium"]

permissions:
  contents: read

concurrency:
  group: semantic-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SIZE: ${{ inputs.size || '20' }}
      CANARIES: ${{ inputs.canaries || '5' }}
      OPENAI_REASONING_EFFORT: ${{ inputs.reasoning_effort || 'medium' }}
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile and run offline tests
        run: |
          python -m py_compile scripts/semantic_audit.py scripts/openai_provider.py scripts/summarize_updates.py
          python -m unittest discover -s tests

      - name: Sampled semantic review on gpt-6.1-sol (Flex), read-only
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_SERVICE_TIER: flex
        run: |
          set -o pipefail
          python scripts/semantic_audit.py --size "$SIZE" --canaries "$CANARIES" --max-cost-usd 0.30 --confirm-spend | tee semantic.log
          { echo '### Semantic audit'; echo '```'; tail -n 1 semantic.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload findings for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-audit
          path: |
            data/eval/semantic_audit.json
            data/eval/semantic_audit.md
          retention-days: 30
          if-no-files-found: warn
