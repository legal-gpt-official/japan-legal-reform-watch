name: Daily update legal reform data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *"

permissions:
  contents: write
  pages: write

# Serialize against the manual translation-backfill workflow so the two never
# write data concurrently (avoids non-fast-forward pushes / lost writes).
concurrency:
  group: japan-legal-reform-data-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Phase 3A: the three Claude stages now use Message Batches. Each waits up
    # to --batch-timeout-seconds (1h) for its own batch, so give the job an
    # explicit ceiling rather than relying on the platform default.
    timeout-minutes: 300

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # Offline gate: compile + regression tests run BEFORE any network fetch.
      # A failure here stops the job, so fetch/build/summarize never run on a
      # broken pipeline. No ANTHROPIC_API_KEY is exposed to these steps.
      - name: Compile pipeline scripts
        run: python -m py_compile scripts/fetch_updates.py scripts/build_public_data.py scripts/build_public_archives.py scripts/summarize_updates.py scripts/translate_updates.py scripts/anthropic_batch.py scripts/source_health.py scripts/alert_common.py scripts/build_public_feeds.py scripts/build_public_pages.py scripts/send_alert_digests.py scripts/setup_alert_billing.py scripts/quality_audit.py scripts/requeue.py

      - name: Run offline regression tests
        run: python -m unittest discover -s tests

      - name: Fetch raw updates
        run: python scripts/fetch_updates.py

      - name: Evaluate source health
        env:
          SOURCE_HEALTH_PERSIST_STATE: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: python scripts/source_health.py evaluate

      - name: Build public data
        run: python scripts/build_public_data.py

      # gpt-6.1-sol on OpenAI Flex since 2026-10-16, after the English prompt
      # gained deterministic law numbers and a confidence cap and a 54-item
      # re-evaluation found it equal to Sonnet 5.5 on law numbers, key dates,
      # confidence and guardrails at ~36% of the per-item cost (PR #47). Flex
      # bills at the Batch rate on a synchronous call, so there is no batch to
      # recover; an unbilled 429 capacity response leaves the item for the next
      # run. The cap is enforced on measured spend (a parallel wave of 5 may
      # overshoot by at most 4 responses); 150 calls measured ~$0.0018 each at
      # Flex, so the cap is headroom and --api-limit binds. Existing summaries are
      # cache hits and are not regenerated. Revert: restore ANTHROPIC_API_KEY +
      # ANTHROPIC_SUMMARY_MODEL: claude-sonnet-5-5 and `--batch` in place of
      # `--parallel 5`.
      - name: Maintain English summaries
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Pin the model explicitly: relying on DEFAULT_MODEL let a
          # repository-level ANTHROPIC_MODEL silently change the billed model.
          ANTHROPIC_SUMMARY_MODEL: gpt-6.1-sol
          OPENAI_SERVICE_TIER: flex
          OPENAI_REASONING_EFFORT: low
        run: |
          set -o pipefail
          python scripts/summarize_updates.py \
            --all-items \
            --english-only \
            --parallel 5 \
            --api-limit 150 \
            --max-cost-usd 1.10 2>&1 | tee english_summary_run.log
          {
            echo "### English summary maintenance (gpt-6.1-sol, Flex)"
            grep -E '^(model|api_calls|summarized_items|failed_items|refused_items|english_remaining|provider_status|provider_error_type|provider_aborted_items|cost_budget_skipped|input_tokens|output_tokens|cache_creation_input_tokens|cache_read_input_tokens|reasoning_tokens|flex_calls|estimated_cost_usd|max_cost_usd|duration_seconds)' english_summary_run.log || true
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -Eq '^provider_status *: unavailable' english_summary_run.log; then
            ptype=$(sed -n 's/^provider_error_type *: //p' english_summary_run.log | head -n 1)
            echo "::warning::English summary provider unavailable: ${ptype}"
            echo "English summary provider unavailable: ${ptype}" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Maintain Japanese coverage for newly published or source-changed items.
      # Existing complete Japanese summaries are cache hits and cost nothing.
      # gpt-6.1-sol on OpenAI Flex since 2026-10-16 (A/B eval: equal quality at
      # 62-65% of Sonnet 5.5's per-item cost; canary run 38835823697). Flex
      # bills at the Batch rate on a synchronous call, so there is no batch to
      # recover; an unbilled 429 capacity response leaves the item for the next
      # run. Revert: restore ANTHROPIC_API_KEY + ANTHROPIC_SUMMARY_MODEL:
      # claude-sonnet-5-5 and `--batch` in place of `--parallel 5`.
      - name: Maintain Japanese summaries
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_SUMMARY_MODEL: gpt-6.1-sol
          OPENAI_SERVICE_TIER: flex
          OPENAI_REASONING_EFFORT: low
        run: |
          set -o pipefail
          python scripts/summarize_updates.py \
            --all-items \
            --japanese-only \
            --parallel 5 \
            --api-limit 100 \
            --max-cost-usd 0.80 2>&1 | tee japanese_summary_run.log
          {
            echo "### Japanese summary maintenance (gpt-6.1-sol, Flex)"
            grep -E '^(model|api_calls|japanese_summarized_items|japanese_failed_items|refused_items|japanese_remaining|provider_status|provider_error_type|provider_aborted_items|cost_budget_skipped|input_tokens|output_tokens|cache_creation_input_tokens|cache_read_input_tokens|reasoning_tokens|flex_calls|estimated_cost_usd|max_cost_usd|duration_seconds)' japanese_summary_run.log || true
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -Eq '^provider_status *: unavailable' japanese_summary_run.log; then
            ptype=$(sed -n 's/^provider_error_type *: //p' japanese_summary_run.log | head -n 1)
            echo "::warning::Japanese summary provider unavailable: ${ptype}"
            echo "Japanese summary provider unavailable: ${ptype}" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Optional Simplified-Chinese translation. Runs AFTER summarize so it
      # translates the final English (AI where available, rule-based otherwise),
      # and re-checks every translation against the current English via source_hash.
      # --limit bounds NEW API calls per run; cache hits are free, and so are
      # fields already memoized from identical English elsewhere.
      #
      # 140, and the largest budget of the three stages, because this stage's
      # demand is roughly double a summary stage's: new arrivals (~37/day) PLUS
      # re-translation of every item whose English the step above just upgraded
      # (up to 50/day, measured at 30). Run 33693101446 confirmed it: 279
      # candidates against a 60 budget left skipped_no_budget: 219, and the
      # untranslated count rose 212 -> 221 in a single day. 60 was not merely
      # slow, it was losing ground, and would have kept losing it for as long as
      # the English backlog took to clear.
      #
      # 120 reached 100% coverage on 2026-09-09. It moved to 140 only because the
      # English limit above went to 80: every English upgrade invalidates that
      # item's Chinese translation, so this stage's demand is arrivals plus that
      # limit, less the overlap between them. Observed at English 50: 70 arrivals
      # + 50 upgrades = 95 candidates. At English 80 a comparable day is ~110.
      # The cap is $1.30 for 140 requests that bound to about $0.98. That is
      # headroom, not a throughput change: cost_budget_skipped has been 0 on
      # every run, so the USD cap has never deferred any work here. What defers
      # work is --limit, which is what skipped_no_budget reports (102 on
      # 2026-09-11 and 41 on 09-12, both clearing the backlog left by a run that
      # was blocked by a still-running batch). Per-request cost is flat at
      # $0.0070 +/- 2% across every run measured, so the bound sits near $0.98
      # whatever the backlog looks like; the extra margin only covers the direct
      # retry calls, which are priced at the full rate and are not in the bound.
      #
      # A title the quality gate rejects gets one direct follow-up call with the
      # Japanese reference removed -- that reference is what carries kana and
      # Japanese phrasing into the Chinese title. The flag used to be refused
      # outright alongside --batch, so from Phase 3A until now the daily run had
      # no recovery at all and a bad sample simply became an English fallback.
      #
      # The cap is $1.10 for 120 calls even though measured spend is ~$0.34,
      # because the pre-flight bound prices count_tokens output at the full
      # input rate while ~70% of this stage's prompt is served from the cache
      # at 0.1x -- $0.426 estimated vs $0.172 actual last run, a 2.5x overshoot.
      # Pricing cache reads correctly would let the cap come back down; until
      # then the cap has to clear the inflated estimate or it silently trims.
      - name: Translate Simplified Chinese updates
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # zh-Hans translation runs on gpt-6.1-sol via OpenAI Flex since
          # 2026-10-16 (A/B eval: better title-gate and naming results at 70-74%
          # of Sonnet 5's per-item cost; canary run 38835823697). Precedence is
          # --model > ANTHROPIC_TRANSLATION_MODEL > DEFAULT_TRANSLATION_MODEL.
          # Revert: ANTHROPIC_API_KEY + ANTHROPIC_TRANSLATION_MODEL:
          # claude-sonnet-5 and `--batch` in place of `--parallel 5`.
          ANTHROPIC_TRANSLATION_MODEL: gpt-6.1-sol
          OPENAI_SERVICE_TIER: flex
          OPENAI_REASONING_EFFORT: low
        # warn mode: a provider-wide error (e.g.
        # insufficient credit) must NOT stop the legal-data pipeline — translations
        # are simply not added this run and a warning annotation is surfaced. A
        # genuine integrity-gate failure (exit 1) still stops the job via pipefail.
        run: |
          set -o pipefail
          python scripts/translate_updates.py \
            --locale zh-Hans \
            --parallel 5 \
            --limit 200 \
            --max-cost-usd 1.50 \
            --retry-rejected-title-without-ja-reference \
            --provider-failure-mode warn 2>&1 | tee translate_run.log
          {
            echo "### Simplified-Chinese translation maintenance (gpt-6.1-sol, Flex)"
            grep -E '^(batch_id|api_calls|reclaimed_batch_items|reclaim_skipped_items|reclaim_failed_items|blocked_by_running_batch|batch_succeeded|batch_errored|batch_expired|batch_canceled|batch_missing|batch_duration_seconds|translated_items|failed_items|refused_items|quality_rejected_items|quality_parked_items|rejection_records|rejections_pruned|title_reference_retries|title_reference_retry_successes|field_cache_hits|field_cache_seeded|field_cache_reviewed|field_cache_added|reviewed_refreshed_items|partial_field_requests|provider_status|provider_error_type|provider_aborted_items|cost_budget_skipped|preflight_cost_usd|preflight_ceiling_usd|preflight_trimmed|input_tokens|output_tokens|cache_creation_input_tokens|cache_read_input_tokens|reasoning_tokens|flex_calls|estimated_cost_usd|max_cost_usd)' translate_run.log || true
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -Eq '^(blocked_by_running_batch|preflight_trimmed) *: *[1-9]' translate_run.log; then
            echo "::warning::Translation batch deferred work this run (interlock or cost bound); it resumes next run."
          fi
          if grep -q "PROVIDER_UNAVAILABLE" translate_run.log; then
            ptype=$(grep -m1 "PROVIDER_UNAVAILABLE" translate_run.log | sed -n 's/.*type=\([a-z_]*\).*/\1/p')
            echo "::warning::Translation provider unavailable: ${ptype}"
            echo "Translation provider unavailable: ${ptype}" >> "$GITHUB_STEP_SUMMARY"
          fi

      # The canonical public JSON remains the complete, uncapped corpus used by
      # the AI stages. Browser-facing yearly files are regenerated afterwards so
      # they always contain the final English summaries and translations.
      - name: Build yearly public archives
        run: python scripts/build_public_archives.py

      # Free tier: static per-area RSS feeds and public-comment deadline
      # calendars under docs/feeds, derived only from the published JSON.
      - name: Build public feeds
        run: python scripts/build_public_feeds.py

      # Crawlable pages: the static latest-updates list and area navigation in
      # docs/index.html, the area landing pages, the open public comments page,
      # and docs/sitemap.xml, all derived only from the published JSON.
      - name: Build public pages
        run: python scripts/build_public_pages.py

      # Offline quality audit of every published item (no API calls, no data
      # writes): the defect classes the 2026-10-16 multilingual audit fixed --
      # Japanese in English, truncated titles, dropped or mis-dated law numbers,
      # case-code romanization, wrong/former bureau names, Chinese kana and era
      # errors, truncated or gate-failing Chinese, open/closed prefix contradicting
      # the stage, Chinese drifting from its cache entry, e-Gov calls labelled as
      # results. HIGH findings raise ::warning annotations and print a ready-to-
      # paste data/requeue.json section; they never block the data commit.
      - name: Quality audit
        run: |
          set -o pipefail
          python scripts/quality_audit.py | tee quality_audit.log
          { echo "### Quality audit"; sed -n '1,200p' quality_audit.log | grep -v '^::warning::'; } >> "$GITHUB_STEP_SUMMARY"

      # Paid tier: the self-serve daily digest. Subscribers are read from Stripe
      # at run time and never written to the repository or this public log.
      # It runs BEFORE the commit so data/alert_digest_state.json (published item
      # ids already announced) lands in the same commit as the data it describes.
      # Scheduled runs only: a manual run must not mail subscribers; items it
      # detects are picked up by the next scheduled run (3-day lookback).
      # Mail delivery never blocks the data commit: every external failure
      # (not configured, Stripe or Resend unavailable) exits 0 with a warning
      # and leaves the items queued, and continue-on-error covers the rest.
      - name: Send email digests
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          STRIPE_ALERTS_API_KEY: ${{ secrets.STRIPE_ALERTS_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_STRIPE_PRODUCT_ID: ${{ vars.ALERT_STRIPE_PRODUCT_ID }}
          ALERT_FROM_EMAIL: ${{ vars.ALERT_FROM_EMAIL }}
          ALERT_REPLY_TO: ${{ vars.ALERT_REPLY_TO }}
          ALERT_MANAGE_URL: ${{ vars.ALERT_MANAGE_URL }}
        run: |
          set -o pipefail
          python scripts/send_alert_digests.py 2>&1 | tee alert_digest_run.log
          {
            echo "### Email digest"
            grep -E '^(status|new_items|upcoming_deadlines|subscribers|subscribers_unrecognized_channel|subscribers_without_email|emails_sent|emails_duplicate|emails_failed|emails_skipped_nothing_to_report|state_updated|missing_settings|stripe_error)' alert_digest_run.log || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check data changes
        id: changes
        run: |
          if git diff --quiet -- data/raw_items.json data/summary_cache.json data/translation_cache.json data/source_health_state.json data/alert_digest_state.json docs/data/legal_updates.json docs/data/legal_updates_manifest.json docs/data/archive docs/feeds docs/index.html docs/sitemap.xml docs/areas docs/public-comments; then
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "data_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push updated data
        id: data_commit
        if: steps.changes.outputs.data_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw_items.json data/summary_cache.json data/translation_cache.json data/source_health_state.json data/alert_digest_state.json docs/data/legal_updates.json docs/data/legal_updates_manifest.json docs/data/archive docs/feeds docs/index.html docs/sitemap.xml docs/areas docs/public-comments
          if git diff --cached --quiet; then
            echo "No staged data changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Daily update legal reform data"
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Request Pages build for committed data
        if: steps.data_commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/pages/builds"

      - name: Enforce source health gate
        env:
          SOURCE_HEALTH_PERSIST_STATE: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: python scripts/source_health.py gate
