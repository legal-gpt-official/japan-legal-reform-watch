name: Daily update legal reform data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *"

permissions:
  contents: write
  pages: write

# Serialize against the manual translation-backfill workflow so the two never
# write data concurrently (avoids non-fast-forward pushes / lost writes).
concurrency:
  group: japan-legal-reform-data-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Phase 3A: the three Claude stages now use Message Batches. Each waits up
    # to --batch-timeout-seconds (1h) for its own batch, so give the job an
    # explicit ceiling rather than relying on the platform default.
    timeout-minutes: 300

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # Offline gate: compile + regression tests run BEFORE any network fetch.
      # A failure here stops the job, so fetch/build/summarize never run on a
      # broken pipeline. No ANTHROPIC_API_KEY is exposed to these steps.
      - name: Compile pipeline scripts
        run: python -m py_compile scripts/fetch_updates.py scripts/build_public_data.py scripts/build_public_archives.py scripts/summarize_updates.py scripts/translate_updates.py scripts/anthropic_batch.py scripts/source_health.py

      - name: Run offline regression tests
        run: python -m unittest discover -s tests

      - name: Fetch raw updates
        run: python scripts/fetch_updates.py

      - name: Evaluate source health
        env:
          SOURCE_HEALTH_PERSIST_STATE: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: python scripts/source_health.py evaluate

      - name: Build public data
        run: python scripts/build_public_data.py

      - name: Maintain English summaries
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Pin the model explicitly, exactly as the Japanese step does. Relying
          # on DEFAULT_MODEL let a repository-level ANTHROPIC_MODEL silently
          # change the billed model for this step only.
          ANTHROPIC_SUMMARY_MODEL: claude-opus-4-8
        # Message Batches (50% discount, same model and same prompt, so no quality
        # change). --parallel does not apply to a batch. The USD cap is enforced as
        # a pre-flight token bound rather than a post-hoc measurement, because a
        # batch reports usage only once it finishes. Dropping --batch restores the
        # direct-call path unchanged.
        #
        # Sized against measured demand and against the backlog. New items arrive
        # at ~38/day, with single days above 70, so 50 calls only cleared about a
        # dozen backlog items on an average day and none at all on a heavy one:
        # run 34289616347 summarized 50 and english_remaining still rose 1689 ->
        # 1709 against 70 arrivals. At 80 the same backlog drains in ~41 days
        # instead of ~142.
        #
        # The cap moves with the limit because the PRE-FLIGHT bound is what
        # decides trimming, not the measured spend. Measured is ~$0.009/call, so
        # 80 calls bill about $0.72 and would look comfortable under $0.80 -- but
        # the bound prices them at ~$0.012/call, i.e. $0.96, and the run would be
        # silently trimmed. That is exactly the failure this budget work started
        # from, so the cap is $1.10 and a test pins the invariant.
        run: |
          set -o pipefail
          python scripts/summarize_updates.py \
            --all-items \
            --english-only \
            --batch \
            --api-limit 80 \
            --max-cost-usd 1.10 2>&1 | tee english_summary_run.log
          {
            echo "### English summary maintenance (batch)"
            grep -E '^(batch_id|api_calls|recovered_items|batch_blocked|batch_succeeded|batch_errored|batch_expired|batch_canceled|batch_missing|summarized_items|failed_items|english_remaining|provider_status|provider_error_type|provider_aborted_items|cost_budget_skipped|preflight_cost_usd|preflight_ceiling_usd|preflight_trimmed|input_tokens|output_tokens|cache_creation_input_tokens|cache_read_input_tokens|estimated_cost_usd|max_cost_usd|duration_seconds)' english_summary_run.log || true
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -Eq '^provider_status *: unavailable' english_summary_run.log; then
            ptype=$(sed -n 's/^provider_error_type *: //p' english_summary_run.log | head -n 1)
            echo "::warning::English summary provider unavailable: ${ptype}"
            echo "English summary provider unavailable: ${ptype}" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Maintain Japanese coverage for newly published or source-changed items.
      # Existing complete Japanese summaries are cache hits and cost nothing.
      # Phase 3A: batched like the English stage. A batch left running by a lost
      # runner is reclaimed on a later run from its self-describing custom_ids,
      # and no new batch is submitted while one is still in flight.
      - name: Maintain Japanese summaries
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_SUMMARY_MODEL: claude-opus-4-8
        run: |
          set -o pipefail
          python scripts/summarize_updates.py \
            --all-items \
            --japanese-only \
            --batch \
            --api-limit 50 \
            --max-cost-usd 0.80 2>&1 | tee japanese_summary_run.log
          {
            echo "### Japanese summary maintenance (batch)"
            grep -E '^(batch_id|api_calls|recovered_items|batch_blocked|batch_succeeded|batch_errored|batch_expired|batch_canceled|batch_missing|japanese_summarized_items|japanese_failed_items|japanese_remaining|provider_status|provider_error_type|provider_aborted_items|cost_budget_skipped|preflight_cost_usd|preflight_ceiling_usd|preflight_trimmed|input_tokens|output_tokens|cache_creation_input_tokens|cache_read_input_tokens|estimated_cost_usd|max_cost_usd|duration_seconds)' japanese_summary_run.log || true
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -Eq '^provider_status *: unavailable' japanese_summary_run.log; then
            ptype=$(sed -n 's/^provider_error_type *: //p' japanese_summary_run.log | head -n 1)
            echo "::warning::Japanese summary provider unavailable: ${ptype}"
            echo "Japanese summary provider unavailable: ${ptype}" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Optional Simplified-Chinese translation. Runs AFTER summarize so it
      # translates the final English (AI where available, rule-based otherwise),
      # and re-checks every translation against the current English via source_hash.
      # --limit bounds NEW API calls per run; cache hits are free, and so are
      # fields already memoized from identical English elsewhere.
      #
      # 140, and the largest budget of the three stages, because this stage's
      # demand is roughly double a summary stage's: new arrivals (~37/day) PLUS
      # re-translation of every item whose English the step above just upgraded
      # (up to 50/day, measured at 30). Run 33693101446 confirmed it: 279
      # candidates against a 60 budget left skipped_no_budget: 219, and the
      # untranslated count rose 212 -> 221 in a single day. 60 was not merely
      # slow, it was losing ground, and would have kept losing it for as long as
      # the English backlog took to clear.
      #
      # 120 reached 100% coverage on 2026-09-09. It moved to 140 only because the
      # English limit above went to 80: every English upgrade invalidates that
      # item's Chinese translation, so this stage's demand is arrivals plus that
      # limit, less the overlap between them. Observed at English 50: 70 arrivals
      # + 50 upgrades = 95 candidates. At English 80 a comparable day is ~110.
      # The cap is $1.30 for 140 requests that bound to about $0.98. That is
      # headroom, not a throughput change: cost_budget_skipped has been 0 on
      # every run, so the USD cap has never deferred any work here. What defers
      # work is --limit, which is what skipped_no_budget reports (102 on
      # 2026-09-11 and 41 on 09-12, both clearing the backlog left by a run that
      # was blocked by a still-running batch). Per-request cost is flat at
      # $0.0070 +/- 2% across every run measured, so the bound sits near $0.98
      # whatever the backlog looks like; the extra margin only covers the direct
      # retry calls, which are priced at the full rate and are not in the bound.
      #
      # A title the quality gate rejects gets one direct follow-up call with the
      # Japanese reference removed -- that reference is what carries kana and
      # Japanese phrasing into the Chinese title. The flag used to be refused
      # outright alongside --batch, so from Phase 3A until now the daily run had
      # no recovery at all and a bad sample simply became an English fallback.
      #
      # The cap is $1.10 for 120 calls even though measured spend is ~$0.34,
      # because the pre-flight bound prices count_tokens output at the full
      # input rate while ~70% of this stage's prompt is served from the cache
      # at 0.1x -- $0.426 estimated vs $0.172 actual last run, a 2.5x overshoot.
      # Pricing cache reads correctly would let the cap come back down; until
      # then the cap has to clear the inflated estimate or it silently trims.
      - name: Translate Simplified Chinese updates
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Translation-only model override: zh-Hans translation uses Sonnet 5;
          # summarization stays on Opus 4.8. Precedence for translation is
          # --model > ANTHROPIC_TRANSLATION_MODEL > DEFAULT_TRANSLATION_MODEL.
          ANTHROPIC_TRANSLATION_MODEL: claude-sonnet-5
        # Phase 3A: batched. A local wait that expires does NOT cancel the batch —
        # it keeps running provider-side and is collected on a later run, so nothing
        # already paid for is thrown away. warn mode: a provider-wide error (e.g.
        # insufficient credit) must NOT stop the legal-data pipeline — translations
        # are simply not added this run and a warning annotation is surfaced. A
        # genuine integrity-gate failure (exit 1) still stops the job via pipefail.
        run: |
          set -o pipefail
          python scripts/translate_updates.py \
            --locale zh-Hans \
            --batch \
            --limit 140 \
            --max-cost-usd 1.30 \
            --retry-rejected-title-without-ja-reference \
            --provider-failure-mode warn 2>&1 | tee translate_run.log
          {
            echo "### Simplified-Chinese translation maintenance (batch)"
            grep -E '^(batch_id|api_calls|reclaimed_batch_items|reclaim_skipped_items|reclaim_failed_items|blocked_by_running_batch|batch_succeeded|batch_errored|batch_expired|batch_canceled|batch_missing|batch_duration_seconds|translated_items|failed_items|quality_rejected_items|quality_parked_items|rejection_records|rejections_pruned|title_reference_retries|title_reference_retry_successes|field_cache_hits|field_cache_seeded|field_cache_reviewed|field_cache_added|reviewed_refreshed_items|partial_field_requests|provider_status|provider_error_type|provider_aborted_items|cost_budget_skipped|preflight_cost_usd|preflight_ceiling_usd|preflight_trimmed|input_tokens|output_tokens|cache_creation_input_tokens|cache_read_input_tokens|estimated_cost_usd|max_cost_usd)' translate_run.log || true
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -Eq '^(blocked_by_running_batch|preflight_trimmed) *: *[1-9]' translate_run.log; then
            echo "::warning::Translation batch deferred work this run (interlock or cost bound); it resumes next run."
          fi
          if grep -q "PROVIDER_UNAVAILABLE" translate_run.log; then
            ptype=$(grep -m1 "PROVIDER_UNAVAILABLE" translate_run.log | sed -n 's/.*type=\([a-z_]*\).*/\1/p')
            echo "::warning::Translation provider unavailable: ${ptype}"
            echo "Translation provider unavailable: ${ptype}" >> "$GITHUB_STEP_SUMMARY"
          fi

      # The canonical public JSON remains the complete, uncapped corpus used by
      # the AI stages. Browser-facing yearly files are regenerated afterwards so
      # they always contain the final English summaries and translations.
      - name: Build yearly public archives
        run: python scripts/build_public_archives.py

      - name: Check data changes
        id: changes
        run: |
          if git diff --quiet -- data/raw_items.json data/summary_cache.json data/translation_cache.json data/source_health_state.json docs/data/legal_updates.json docs/data/legal_updates_manifest.json docs/data/archive; then
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "data_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push updated data
        id: data_commit
        if: steps.changes.outputs.data_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw_items.json data/summary_cache.json data/translation_cache.json data/source_health_state.json docs/data/legal_updates.json docs/data/legal_updates_manifest.json docs/data/archive
          if git diff --cached --quiet; then
            echo "No staged data changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Daily update legal reform data"
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Request Pages build for committed data
        if: steps.data_commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/pages/builds"

      - name: Enforce source health gate
        env:
          SOURCE_HEALTH_PERSIST_STATE: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: python scripts/source_health.py gate
